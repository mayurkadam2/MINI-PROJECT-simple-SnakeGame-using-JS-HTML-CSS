<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>HIGH SCORE:
                        <span id="high-score">00</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>SCORE:
                        <span id="score">00</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>TIME:
                        <span id="time">00:00</span>
                    </h3>
                </div>
            </div>
            <div class="board">

            </div>

        </section>
        <div class="modal">
            <div class="start-game">
                <h3>Welcome To Snake Game</h3>
                <div class="btn">
                    <button class="btn-start">Start</button>
                </div>

            </div>
            <div class="restart-game">
                <h3>Game over Restart</h3>
                <div class="btn">
                    <button class="btn-restart">Restart</button>
                </div>

            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
